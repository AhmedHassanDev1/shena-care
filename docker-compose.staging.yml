version: '3.8'

services:
  postgres:
    image: postgres:17-alpine
    container_name: shenacare-staging-postgres
    env_file:
      - .env.staging
    ports:
      - "5432:5432"
    volumes:
      - staging_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: shenacare-staging-api
    env_file:
      - .env.staging
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
      ai:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  ai:
    build:
      context: ./services/ai
      dockerfile: Dockerfile
    container_name: shenacare-staging-ai
    env_file:
      - .env.staging
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: shenacare-staging-web
    env_file:
      - .env.staging
    ports:
      - "3000:3000"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  staging_postgres_data:
    driver: local
