version: '3.8'

services:
  postgres:
    image: postgres:17-alpine
    container_name: shenacare-postgres
    command: postgres -c fsync=off -c synchronous_commit=off -c full_page_writes=off
    environment:
      POSTGRES_DB: shenacare
      POSTGRES_USER: shenacare
      POSTGRES_PASSWORD: shenacare
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shenacare -d shenacare"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local
